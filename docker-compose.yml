services:
  postgres:
    image: postgres:18.2
    container_name: postgres
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - backend

  redis:
    image: redis:8.8.0
    container_name: redis
    ports:
      - "${REDIS_PORT}:6379"
    networks:
      - backend

volumes:
  pgdata:

networks:
  backend:
